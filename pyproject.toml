[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "failure-scenarios"
version = "0.1.0"
description = "Deterministic, reproducible dependency-failure scenarios for testing retries, fallbacks, timeouts and recovery."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Bsrat Mulugeta", email = "bsratmulugetasergawie@gmail.com" }]
keywords = ["testing", "fault-injection", "resilience", "retry", "httpx", "requests", "pytest"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: Pytest",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
httpx = ["httpx>=0.27"]
requests = ["requests>=2.31"]
pytest = ["pytest>=8.0"]
all = ["httpx>=0.27", "requests>=2.31", "pytest>=8.0"]

[project.entry-points.pytest11]
failure_scenarios = "failure_scenarios.pytest_plugin"

[dependency-groups]
dev = [
    "httpx>=0.27",
    "requests>=2.31",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-requests",
    "fastapi>=0.115",
]
docs = ["mkdocs-material>=9.5"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "examples", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.hatch.build.targets.wheel]
packages = ["src/failure_scenarios"]

[tool.pytest.ini_options]
testpaths = ["tests", "examples"]
addopts = "-ra"

[tool.coverage.run]
source = ["failure_scenarios"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src"]
